<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <div class="dashboard-container">

        <h1>Dashboard</h1>

        <h2>Registered Users</h2>

        <button onclick="loadUsers()">
            View Users
        </button>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                </tr>

            </thead>

            <tbody id="userTable"></tbody>

        </table>

        <button onclick="logout()">
            Back to Login
        </button>

    </div>

    <script>

        function loadUsers() {

            fetch("/users")

                .then(response => response.json())

                .then(users => {

                    const table =
                        document.getElementById("userTable");

                    table.innerHTML = "";

                    users.forEach(user => {

                        const row =
                            document.createElement("tr");

                        row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                        `;

                        table.appendChild(row);

                    });

                })

                .catch(error => {

                    console.error(error);

                });
        }


        function logout() {

            window.location.href = "/";

        }

    </script>

</body>

</html>
